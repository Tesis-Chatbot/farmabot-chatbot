version: "3.1"

intents:
  - saludar
  - despedirse
  - vincular_ticket
  - consultar_promociones
  - goodbye
  - bot_challenge
  - informar_sucursal

entities:
  - folio
  - tarjeta
  - card
  - ticket
  - producto
  - sucursal

slots:
  folio:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: folio
  tarjeta:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: tarjeta
  sucursal:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: sucursal

responses:
  utter_saludar:
    - text: "¡Hola! Soy el asistente de la farmacia. ¿En qué puedo ayudarte?"
  utter_goodbye:
    - text: "Hasta luego, ¡que tengas un buen día!"
  utter_iamabot:
    - text: "Soy un bot de soporte para la vinculación de puntos de farmacia."
  utter_ask_sucursal:
    - text: "¿En qué sucursal se realizó la compra? Por favor indícame el número de sucursal."

forms:
  vincular_ticket_form:
    required_slots:
      - folio
      - tarjeta
      - sucursal

actions:
  - action_vincular_ticket
  - action_consultar_promociones
  - validate_vincular_ticket_form